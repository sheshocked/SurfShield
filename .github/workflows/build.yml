name: Build SurfShield APKs

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build SurfShield APKs
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [arm64-v8a, armeabi-v7a, x86_64, x86]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build APK with Gradle
        run: ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_androidBuildTarget: ${{ matrix.target }}
      
      - name: Sign APK
        run: |
          echo "Signing APK for ${{ matrix.target }}"
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              mv "$apk" "app/build/outputs/apk/release/app-${{ matrix.target }}-release.apk"
            fi
          done
          # Debug keystore signing
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
                -keystore debug.keystore -storepass android -keypass android \
                "$apk" androiddebugkey
            fi
          done
      
      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true

