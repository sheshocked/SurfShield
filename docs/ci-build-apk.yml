# Copy this file to .github/workflows/build.yml
#
# It is kept here because an OAuth token cannot create files under
# .github/workflows - GitHub requires the separate workflow scope for that, so
# this one step has to be done by hand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   LOCATIONS_JSON_B64   base64 -w0 secrets/locations.json     (required)
#   VAULT_PASSPHRASE     any long random string                (recommended)
#   KEYSTORE_B64         base64 -w0 keystore/release.jks       (optional)
#   KEYSTORE_PASSWORD    keystore password                     (with the above)
#   KEY_ALIAS            key alias                             (with the above)
#   KEY_PASSWORD         key password                          (with the above)

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AmneziaWG publishes no Maven artifact: the tunnel module compiles its
      # native libraries from source. Clone it if the submodule is absent so a
      # fresh checkout builds either way.
      - name: Vendor AmneziaWG
        run: |
          if [ ! -d third_party/amneziawg-android/tunnel ]; then
            git clone --depth 1 \
              https://github.com/amnezia-vpn/amneziawg-android \
              third_party/amneziawg-android
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The tunnel module's CMake build shells out to the Go toolchain.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.0.12077973' 'cmake;3.22.1' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3

      # Server profiles are not in the repository. They are supplied here and
      # encrypted into an asset by the build, so nothing readable is committed.
      - name: Provide server profiles
        env:
          LOCATIONS_JSON_B64: ${{ secrets.LOCATIONS_JSON_B64 }}
        run: |
          if [ -z "$LOCATIONS_JSON_B64" ]; then
            echo "::error::LOCATIONS_JSON_B64 is not set, so the app would ship with an" \
                 "empty server list. Set it to: base64 -w0 secrets/locations.json"
            exit 1
          fi
          mkdir -p secrets
          echo "$LOCATIONS_JSON_B64" | base64 -d > secrets/locations.json
          echo "Decoded $(wc -c < secrets/locations.json) bytes of profiles."

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          else
            echo "No keystore secret set - the release APK will be debug-signed."
          fi

      - name: Build debug APK
        env:
          SURFSHIELD_VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          SURFSHIELD_VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # The decoded plaintext must not survive into an artifact.
      - name: Remove decoded secrets
        if: always()
        run: rm -rf secrets keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SurfShield-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SurfShield-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
