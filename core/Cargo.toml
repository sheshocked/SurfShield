[package]
name = "surfshield-core"
version = "0.1.0"
edition = "2021"
authors = ["SurfShield"]

[lib]
crate-type = ["cdylib"]

[dependencies]
boringtun = { git = "https://github.com/cloudflare/boringtun", branch = "master", package = "boringtun", default-features = false }
tokio = { version = "1", features = ["full"] }
bytes = "1"
log = "0.4"
env_logger = "0.10"
hex = "0.4"
base64 = "0.21"
rand = "0.8"
tun = { package = "tun", git = "https://github.com/meh/rust-tun", features = ["android"] }
ipnetwork = "0.20"
socket2 = "0.5"
parking_lot = "0.12"
once_cell = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
getrandom = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1

